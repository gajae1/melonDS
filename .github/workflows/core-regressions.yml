name: Core regressions

on:
  push:
    branches:
      - master
      - fix/core-regressions-20260907
      - modernize/cpp26-bitfield
      - ci/*
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14
            compiler: g++-14
            c_compiler: gcc-14
            flags: ""
          - name: Clang 18 ASan UBSan
            compiler: clang++-18
            # C sources must use the same sanitizer runtime as the C++ ones.
            c_compiler: clang-18
            # vptr checks need the full core's RTTI; standalone tests link single sources.
            flags: -fsanitize=address,undefined -fno-sanitize=vptr -fno-sanitize-recover=all -fno-omit-frame-pointer
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install C++26 toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 clang-18
          python3 -m venv "$RUNNER_TEMP/cmake-env"
          "$RUNNER_TEMP/cmake-env/bin/pip" install cmake==4.4.3
          echo "$RUNNER_TEMP/cmake-env/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: >-
          cmake -S tests -B build-regression -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER="${{ matrix.c_compiler }}"
          -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}"
          -DCMAKE_C_FLAGS="${{ matrix.flags }}"
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
      - name: Build
        run: cmake --build build-regression --parallel 2
      - name: Test
        run: ctest --test-dir build-regression --output-on-failure

  core-build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            jit: "ON"
            tests: "core-.*execution|teakra-execution-events-state"
          - runner: ubuntu-24.04
            jit: "OFF"
            tests: "core-.*execution|teakra-execution-events-state"
          # The only CI host that executes the ARM64 JIT backend.
          - runner: ubuntu-24.04-arm
            jit: "ON"
            tests: "^core-|^arm64-"
    name: C++26 core JIT ${{ matrix.jit }} (${{ matrix.runner }})
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build
          python3 -m venv "$RUNNER_TEMP/cmake-env"
          "$RUNNER_TEMP/cmake-env/bin/pip" install cmake==4.4.3
          echo "$RUNNER_TEMP/cmake-env/bin" >> "$GITHUB_PATH"
      - name: Configure full core
        run: >-
          cmake -S . -B build-core -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          -DBUILD_QT_SDL=OFF -DENABLE_OGLRENDERER=OFF
          -DMELONDS_BUILD_TESTS=ON
          -DENABLE_JIT=${{ matrix.jit }}
      - name: Compile full core
        run: cmake --build build-core --parallel 2
      - name: Execute CPU and DSP integration checks
        run: ctest --test-dir build-core -R '${{ matrix.tests }}' --output-on-failure
